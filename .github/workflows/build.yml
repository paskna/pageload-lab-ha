name: Build PageLoad Lab

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: pageload-lab

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pageload-lab/requirements.txt
            pageload-lab/requirements-dev.txt
      - name: Install dependencies
        working-directory: pageload-lab
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Chromium for integration tests
        working-directory: pageload-lab
        run: python -m playwright install --with-deps chromium
      - name: Run unit and browser integration tests
        working-directory: pageload-lab
        run: pytest --cov=app --cov-report=term-missing

  container-smoke:
    name: AppArmor container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install AppArmor parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-utils
      - name: Validate and load AppArmor profile
        run: |
          test "$(cat /sys/module/apparmor/parameters/enabled)" = "Y"
          sudo apparmor_parser --skip-kernel-load --skip-cache pageload-lab/apparmor.txt
          sudo apparmor_parser --replace pageload-lab/apparmor.txt
      - name: Build smoke-test image
        run: docker build --build-arg BUILD_VERSION=0.1.1 --tag pageload-lab:smoke pageload-lab
      - name: Verify executable file layout
        run: |
          docker run --rm --entrypoint /usr/local/bin/python3.12 pageload-lab:smoke -c \
            "import os; paths=['/opt/pageload-lab/run.sh','/usr/bin/env','/bin/sh','/usr/local/bin/python3.12','/usr/local/bin/uvicorn','/usr/local/lib/python3.12/site-packages/playwright/driver/node']; assert all(os.path.isfile(p) and os.access(p, os.X_OK) for p in paths); assert any(os.access(p, os.X_OK) for root, _, files in os.walk('/ms-playwright') for name in ('chrome','headless_shell','chrome-headless-shell') if (p := os.path.join(root, name)) in [os.path.join(root, f) for f in files])"
      - name: Execute env under AppArmor
        run: docker run --rm --security-opt apparmor=pageload_lab --entrypoint /usr/bin/env pageload-lab:smoke --version >/dev/null
      - name: Execute shell under AppArmor
        run: docker run --rm --security-opt apparmor=pageload_lab --entrypoint /bin/sh pageload-lab:smoke -c 'exit 0'
      - name: Execute data setup commands under AppArmor
        run: |
          docker run --rm --security-opt apparmor=pageload_lab --entrypoint /usr/bin/mkdir pageload-lab:smoke --version >/dev/null
          docker run --rm --security-opt apparmor=pageload_lab --entrypoint /usr/bin/chmod pageload-lab:smoke --version >/dev/null
      - name: Execute Python and Uvicorn under AppArmor
        run: |
          docker run --rm --security-opt apparmor=pageload_lab --entrypoint /usr/local/bin/python3.12 pageload-lab:smoke --version
          docker run --rm --security-opt apparmor=pageload_lab --entrypoint /usr/local/bin/uvicorn pageload-lab:smoke --version
      - name: Execute Playwright Node under AppArmor
        run: docker run --rm --security-opt apparmor=pageload_lab --entrypoint /usr/local/lib/python3.12/site-packages/playwright/driver/node pageload-lab:smoke --version
      - name: Start and stop Chromium under AppArmor
        run: |
          docker run --rm --security-opt apparmor=pageload_lab \
            --entrypoint /usr/local/bin/python3.12 pageload-lab:smoke -c \
            $'import asyncio\nfrom playwright.async_api import async_playwright\nasync def check():\n    p = await async_playwright().start()\n    b = await p.chromium.launch(headless=True, args=["--no-sandbox", "--disable-setuid-sandbox"])\n    assert b.is_connected()\n    await b.close()\n    await p.stop()\nasyncio.run(check())'
      - name: Create persistent data layout under AppArmor
        run: |
          docker run --rm --security-opt apparmor=pageload_lab --tmpfs /data \
            --entrypoint /bin/sh pageload-lab:smoke -c \
            'mkdir -p /data/reports /data/logs && chmod 0700 /data && test -d /data/reports && test -d /data/logs'
      - name: Initialize application paths and logging under AppArmor
        run: |
          docker run --rm --security-opt apparmor=pageload_lab \
            --env PAGELAB_DATA_DIR=/tmp/pageload-lab-component \
            --entrypoint /usr/local/bin/python3.12 pageload-lab:smoke -c \
            'from app.settings import Paths; from app.logging_config import configure_logging; p=Paths.from_environment(); p.ensure(); configure_logging(p.logs)'
      - name: Initialize SQLite under AppArmor
        run: |
          docker run --rm --security-opt apparmor=pageload_lab \
            --env PAGELAB_DATA_DIR=/tmp/pageload-lab-component \
            --entrypoint /usr/local/bin/python3.12 pageload-lab:smoke -c \
            'from app.settings import Paths; from app.database import Database; p=Paths.from_environment(); p.ensure(); d=Database(p.database); d.initialize(); d.close()'
      - name: Initialize settings and secrets under AppArmor
        run: |
          docker run --rm --security-opt apparmor=pageload_lab \
            --env PAGELAB_DATA_DIR=/tmp/pageload-lab-component \
            --entrypoint /usr/local/bin/python3.12 pageload-lab:smoke -c \
            'from app.settings import Paths,SettingsStore; from app.database import Database; from app.security import SecretBox,load_or_create_secret; p=Paths.from_environment(); p.ensure(); d=Database(p.database); d.initialize(); SettingsStore(d.session_factory).ensure_defaults(); SecretBox(p.secret_key); load_or_create_secret(p.csrf_secret); d.close()'
      - name: Run FastAPI lifespan under AppArmor
        run: |
          docker run --rm --security-opt apparmor=pageload_lab \
            --env PAGELAB_DATA_DIR=/tmp/pageload-lab-component \
            --entrypoint /usr/local/bin/python3.12 pageload-lab:smoke -c \
            $'import asyncio\nfrom app.main import app, lifespan\nasync def check():\n    async with lifespan(app):\n        assert app.state.scheduler.status()["running"]\n        assert (await app.state.browser.health())["available"]\nasyncio.run(check())'
      - name: Verify entrypoint baseline without custom AppArmor
        run: |
          docker run --detach --name pageload-lab-baseline \
            --security-opt apparmor=unconfined \
            --env PAGELAB_DATA_DIR=/tmp/pageload-lab-data \
            pageload-lab:smoke
          sleep 5
          test "$(docker inspect --format '{{.State.Running}}' pageload-lab-baseline)" = "true"
          docker rm --force pageload-lab-baseline
      - name: Start entrypoint with temporary data under AppArmor
        run: |
          docker run --detach --name pageload-lab-temp-data \
            --security-opt apparmor=pageload_lab \
            --env PAGELAB_DATA_DIR=/tmp/pageload-lab-data \
            pageload-lab:smoke
          sleep 5
      - name: Verify entrypoint execution was permitted
        run: test "$(docker inspect --format '{{.State.ExitCode}}' pageload-lab-temp-data)" != "126"
      - name: Verify profiled entrypoint remains running
        run: |
          test "$(docker inspect --format '{{.State.Running}}' pageload-lab-temp-data)" = "true"
          docker rm --force pageload-lab-temp-data
      - name: Start container under PageLoad Lab AppArmor profile
        run: |
          docker volume create pageload-lab-smoke-data
          docker run --detach --name pageload-lab-smoke \
            --security-opt apparmor=pageload_lab \
            --publish 127.0.0.1:8099:8099 \
            --volume pageload-lab-smoke-data:/data \
            pageload-lab:smoke
      - name: Verify entrypoint remains running
        run: |
          sleep 5
          test "$(docker inspect --format '{{.State.Running}}' pageload-lab-smoke)" = "true"
      - name: Verify Uvicorn on port 8099
        run: |
          health_ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8099/health > health.json; then
              health_ready=true
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' pageload-lab-smoke | grep --quiet true; then
              false
            fi
            sleep 2
          done
          test "$health_ready" = true
      - name: Verify database and scheduler health
        run: jq --exit-status '.backend and .database and .scheduler' health.json >/dev/null
      - name: Verify Playwright Chromium health
        run: |
          jq --exit-status '.status == "healthy" and .browser_engine.available' health.json >/dev/null
          curl --fail --silent http://127.0.0.1:8099/api/system > system.json
          jq --exit-status '.chromium_version and .chromium_version != "Nicht verfügbar"' system.json >/dev/null
      - name: Verify graceful SIGTERM shutdown
        run: |
          docker kill --signal=TERM pageload-lab-smoke
          test "$(docker wait pageload-lab-smoke)" = "0"
      - name: Clean up smoke-test resources
        if: always()
        run: |
          docker rm --force pageload-lab-baseline 2>/dev/null || true
          docker rm --force pageload-lab-temp-data 2>/dev/null || true
          docker rm --force pageload-lab-smoke 2>/dev/null || true
          docker volume rm pageload-lab-smoke-data 2>/dev/null || true
          sudo apparmor_parser --remove pageload_lab 2>/dev/null || true

  init:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      publish: ${{ steps.values.outputs.publish }}
      version: ${{ steps.values.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
      - id: values
        shell: bash
        run: |
          version="$(python3 -c "import yaml; print(yaml.safe_load(open('pageload-lab/config.yaml'))['version'])")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: [tests, container-smoke, init]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Build architecture image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./pageload-lab
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest
          push: ${{ needs.init.outputs.publish }}
          version: ${{ needs.init.outputs.version }}

  manifest:
    name: Publish multi-architecture manifest
    needs: [init, build]
    if: needs.init.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.init.outputs.version }}
            latest

  verify-manifest:
    name: Verify multi-architecture manifest
    needs: [init, manifest]
    if: needs.init.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify version and latest manifests
        env:
          VERSION: ${{ needs.init.outputs.version }}
        run: |
          for tag in "$VERSION" latest; do
            docker buildx imagetools inspect --raw "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pageload-lab:${tag}" > manifest.json
            jq --exit-status '[.manifests[].platform | select(.os == "linux") | .architecture] | index("amd64") != null and index("arm64") != null' manifest.json
          done
